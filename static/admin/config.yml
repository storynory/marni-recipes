backend:
  name: github
  repo: storynory/marni-recipes
  branch: main

publish_mode: editorial_workflow   # see #2 below

media_folder: "static/uploads"
public_folder: "/uploads"
media_libraries:
  default:
    config:
      # (Optional, but helpful) make sure your UI accepts typical image types
      accept_mime_types:
        - image/jpeg
        - image/png
        - image/webp
        - image/svg+xml

      transformations:
        raster_image:        # jpg / png / etc.
          format: webp       # only 'webp' is supported
          quality: 85        # default 85
          width: 2048        # max width (no upscaling)
          height: 2048       # max height (no upscaling)
        svg:
          optimize: true

collections:
  - name: "recipes"
    label: "Recipes"
    folder: "content/recipes"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Title", widget: "string" } # keep required (default)
      - { name: "body", label: "Recipe Notes", widget: "markdown", required: false }
      - { name: "date", label: "Date", widget: "datetime", required: false }
      - { name: "thumbnail", label: "Thumbnail", widget: "image", required: false }
      - name: "ingredients"
        label: "Ingredients"
        widget: "list"
        required: false
        field: { name: "item", label: "Item", widget: "string" }
      - { name: "method", label: "Method", widget: "markdown", class: "method-field", required: false }
      - { name: "draft", label: "Draft", widget: "boolean", default: true, required: false }
    